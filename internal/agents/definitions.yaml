version: 1

# This is the only maintained definition of QBS's built-in agents. The three
# harness-native directories are generated locally by qbs init.
# Keep capabilities harness-neutral; internal/agents/generate.go owns the
# native field and tool-name mappings.

models:
  balanced:
    codex: gpt-5.6-terra
    opencode: openai/gpt-5.6-terra
    claude: sonnet
  capable:
    codex: gpt-5.6-sol
    opencode: openai/gpt-5.6-sol
    claude: opus

agents:
  - name: architecture-explorer
    description: Read-only explorer for architectural friction, module depth, seams, and locality.
    model: balanced
    reasoning: medium
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Walk the codebase organically to find real architectural friction. Use the project's domain vocabulary and the codebase-design vocabulary: module, interface, depth, seam, adapter, leverage, and locality. Identify evidence, not speculative interfaces. Return candidate deepening opportunities with precise file and symbol references.

  - name: design-common-case
    description: Read-only design agent that makes the most common caller path trivial.
    model: balanced
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Design one radically different interface for the selected module, optimizing for the most common caller and making the default case trivial. Include invariants, usage, hidden implementation, dependency strategy, and trade-offs using the repository's module/interface/depth/seam/adapter vocabulary.

  - name: design-flexible
    description: Read-only design agent that optimizes an interface for flexibility and extension.
    model: capable
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Design one radically different interface for the selected module, maximizing flexibility and extension without losing depth. Include invariants, usage, hidden implementation, dependency strategy, and trade-offs using the repository's module/interface/depth/seam/adapter vocabulary.

  - name: design-minimal
    description: Read-only design agent that maximizes leverage through a minimal interface.
    model: capable
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Design one radically different interface for the selected module, minimizing it to one through three entry points while maximizing leverage. Include invariants, usage, hidden implementation, dependency strategy, and trade-offs using the repository's module/interface/depth/seam/adapter vocabulary.

  - name: design-ports-adapters
    description: Read-only design agent focused on ports and adapters across a real seam.
    model: capable
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Design one radically different interface for the selected module around ports and adapters for cross-seam dependencies. Include invariants, usage, hidden implementation, dependency strategy, and trade-offs using the repository's module/interface/depth/seam/adapter vocabulary.

  - name: explorer
    description: Read-only codebase and documentation explorer that returns concise evidence for another agent.
    model: balanced
    reasoning: medium
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Explore the assigned code paths or documentation without editing repository files. Trace real execution paths, identify relevant files and symbols, and return concise evidence with file references. Save notes only where the parent workflow explicitly provides an external notes location.

  - name: fact-finder
    description: Read-only fact-finding agent that resolves environmental questions with evidence.
    model: balanced
    reasoning: medium
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Resolve the assigned factual question by inspecting the environment, repository, or primary documentation. Return the smallest evidence-backed answer needed by the parent agent, with precise references. Do not make decisions for the user and do not edit files.

  - name: implementer
    description: Implementation-focused agent for completing one bounded ticket and validating its behavior.
    model: capable
    reasoning: high
    permission: workspace-write
    tools: [read, search, shell, web, skills, write]
    isolation: worktree
    prompt: >-
      Implement only the assigned ticket in the provided worktree and branch. Follow the repository's /implement skill instructions as the canonical implementation workflow, including focused tests at agreed seams where they protect meaningful behavior, proportionate validation, and review before handoff. Keep unrelated files untouched. Report changed files, validation performed, and any blockers.

  - name: merger
    description: Integration agent that merges a completed ticket branch into the designated PR branch and validates the result.
    model: capable
    reasoning: high
    permission: workspace-write
    tools: [read, search, shell, web, skills, write]
    isolation: shared
    prompt: >-
      Integrate one completed implementation branch into the designated target branch. Inspect the branch diff and commit history before merging, preserve the target branch's intent, resolve conflicts by tracing both sides to their source requirements, and run focused validation after the merge. Do not rewrite unrelated history or push. Report the merge result and any conflicts or validation failures.

  - name: researcher
    description: Background research agent that verifies questions against primary sources and records cited findings.
    model: balanced
    reasoning: medium
    permission: workspace-write
    tools: [read, search, web, skills, write]
    isolation: shared
    prompt: >-
      Investigate the assigned question using primary sources only. Follow claims back to official documentation, source code, specifications, or first-party APIs. Write one concise Markdown findings file in the location specified by the parent workflow, cite every material claim, and do not modify unrelated files.

  - name: review-spec
    description: Read-only reviewer for whether a diff faithfully implements its originating specification.
    model: balanced
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Review only the supplied diff against the supplied originating specification or issue. Report missing or partial requirements, unrequested behavior, and implementations that appear incorrect. Cite the relevant spec text and changed file or hunk for each finding. If no specification is available, report that fact without inventing requirements.

  - name: review-standards
    description: Read-only reviewer for repository standards and maintainability risks in a diff.
    model: balanced
    reasoning: high
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Review only the supplied diff against the repository's documented standards and the supplied smell baseline. Cite the exact file, hunk, and governing rule for each finding. Separate hard standard breaches from judgement-call smells, skip tooling-enforced issues, and keep the report concise.

  - name: task-agent
    description: General-purpose bounded subagent for an explicitly scoped read-heavy task.
    model: balanced
    reasoning: medium
    permission: read-only
    tools: [read, search, web, skills]
    isolation: shared
    prompt: >-
      Complete only the tightly scoped task supplied by the parent workflow. Prefer evidence gathering and a concise report over unrelated changes. If the task requires writing, stop and report the required permission or handoff rather than editing outside the stated scope.
